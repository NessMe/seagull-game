<head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height:100vh; overflow:hidden; font-family:'Montserrat',sans-serif; background:#FFB89A; transition:background 2s linear; cursor:none; }
    #canvas-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
    #title-overlay { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; text-align:center; pointer-events:none; user-select:none; }
    #title-overlay h1 { font-family:'Montserrat',sans-serif; font-weight:300; font-size:clamp(3rem,10vw,8rem); color:#fff; letter-spacing:.25em; text-transform:uppercase; text-shadow:0 2px 30px rgba(120,180,220,.6),0 0 80px rgba(100,160,210,.3); animation:fadeIn 2s ease forwards; opacity:0; }
    #title-overlay .subtitle { font-family:'Montserrat',sans-serif; font-weight:300; font-size:clamp(.6rem,2vw,1rem); color:rgba(255,255,255,.75); letter-spacing:.5em; text-transform:uppercase; margin-top:.5em; animation:fadeIn 2s ease .8s forwards; opacity:0; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    #controls-hint { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:10; font-family:'Montserrat',sans-serif; font-weight:300; font-size:.7rem; color:rgba(255,255,255,.55); letter-spacing:.2em; text-transform:uppercase; animation:fadeIn 2s ease 1.5s forwards; opacity:0; pointer-events:none; }
    #time-indicator { position:fixed; top:1.2rem; right:1.5rem; z-index:20; font-family:'Montserrat',sans-serif; font-weight:300; font-size:.75rem; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.9); background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.22); padding:.4em .9em; border-radius:2em; backdrop-filter:blur(6px); pointer-events:none; animation:fadeIn 2s ease 2s forwards; opacity:0; min-width:10em; text-align:center; }
    #loading-screen { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(20,30,50,0.85); color:#fff; font-family:'Montserrat',sans-serif; font-weight:300; letter-spacing:.2em; text-transform:uppercase; font-size:.9rem; gap:1rem; transition:opacity 0.8s ease; }
    #loading-screen.hidden { opacity:0; pointer-events:none; }
    #loading-bar-wrap { width:220px; height:3px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden; }
    #loading-bar { height:100%; width:0%; background:#fff; border-radius:2px; transition:width 0.3s ease; }
    #model-status { position:fixed; top:1.2rem; left:1.5rem; z-index:20; font-family:'Montserrat',sans-serif; font-weight:300; font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.75); background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.22); padding:.35em .8em; border-radius:2em; backdrop-filter:blur(6px); pointer-events:none; }
    #crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:15; pointer-events:none; width:16px; height:16px; }
    #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.6); border-radius:2px; }
    #crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
    #crosshair::after { height:2px; width:100%; top:50%; transform:translateY(-50%); }
    #fish-counter { position:fixed; bottom:2rem; right:1.5rem; z-index:20; font-family:'Montserrat',sans-serif; font-weight:300; font-size:.85rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.95); background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.28); padding:.5em 1.2em; border-radius:2em; backdrop-filter:blur(8px); pointer-events:none; animation:fadeIn 2s ease 2s forwards; opacity:0; transition:transform .15s ease; }
    #fish-counter.pop { transform:scale(1.25); }
    #catch-popup { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%); z-index:30; pointer-events:none; font-family:'Montserrat',sans-serif; font-weight:700; font-size:2rem; color:#fff; letter-spacing:.15em; text-transform:uppercase; text-shadow: 0 2px 20px rgba(0,180,255,.7), 0 0 60px rgba(0,220,255,.4); opacity:0; transition:opacity .2s ease; }
    #dive-indicator { position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%); z-index:20; font-family:'Montserrat',sans-serif; font-weight:300; font-size:.65rem; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.0); transition:color .3s ease; pointer-events:none; }
    #dive-indicator.active { color:rgba(255,220,80,.85); }
    /* Зона ловли: жёлтая подсветка индикатора */
    #dive-indicator.catch-zone { color:rgba(255,200,0,1); font-weight:700; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div>Загрузка модели…</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  </div>
  <div id="canvas-container"></div>
  <div id="title-overlay"><h1>Чайка</h1><div class="subtitle">полёт над морем</div></div>
  <div id="controls-hint">WASD / ←→↑↓ — движение · Мышь — поворот · SHIFT — вверх · CTRL — вниз · ПРОБЕЛ — пикировать · N — ускорить время ×10</div>
  <div id="time-indicator">☀ Утро · 0с</div>
  <div id="model-status">⏳ Загрузка…</div>
  <div id="fish-counter">🐟 0</div>
  <div id="catch-popup">+ РЫБА!</div>
  <div id="dive-indicator">▼ ПИКИРОВАНИЕ</div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Renderer & Scene ─────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xFFD0AA, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(0, 8, 16);

    // ── Lights ───────────────────────────────────────────────────────────────
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xFFAA66, 0.8);
    dirLight.position.set(0, 80, -150);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048,2048);
    dirLight.shadow.camera.far = 400;
    dirLight.shadow.camera.left = -150; dirLight.shadow.camera.right = 150;
    dirLight.shadow.camera.top = 150; dirLight.shadow.camera.bottom = -150;
    scene.add(dirLight);

    const fillLight = new THREE.HemisphereLight(0x87CEEB, 0x7EC8E3, 0.3);
    scene.add(fillLight);

    // ── Sun ──────────────────────────────────────────────────────────────────
    const sunGroup = new THREE.Group();
    sunGroup.position.set(0, 80, -150);
    sunGroup.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(3,32,32), new THREE.MeshBasicMaterial({color:0xFFFDE0,fog:false,depthWrite:false,depthTest:false})), {renderOrder:999}));
    sunGroup.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(6,32,32), new THREE.MeshBasicMaterial({color:0xFFE082,transparent:true,opacity:0.4,fog:false,depthWrite:false,depthTest:false})), {renderOrder:998}));
    sunGroup.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(10,32,32), new THREE.MeshBasicMaterial({color:0xFFD54F,transparent:true,opacity:0.15,fog:false,depthWrite:false,depthTest:false})), {renderOrder:997}));
    scene.add(sunGroup);

    const sunLight = new THREE.PointLight(0xFFF8DC, 2, 200);
    sunLight.position.set(0, 0.5, -150);
    scene.add(sunLight);

    // ── Moon & Stars ─────────────────────────────────────────────────────────
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-40,40,-120);
    moonGroup.visible = false;
    moonGroup.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(3,32,32), new THREE.MeshBasicMaterial({color:0xFFFACD,fog:false,depthWrite:false,depthTest:false})),{renderOrder:999}));
    moonGroup.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(5.5,32,32), new THREE.MeshBasicMaterial({color:0xD0E8FF,transparent:true,opacity:0.18,fog:false,depthWrite:false,depthTest:false})),{renderOrder:998}));
    scene.add(moonGroup);
    const moonLight = new THREE.PointLight(0x8899CC, 0, 200);
    moonLight.position.set(-40,0.5,-60);
    scene.add(moonLight);

    const STAR_COUNT = 300;
    const sp = new Float32Array(STAR_COUNT*3);
    for(let i=0;i<STAR_COUNT;i++){const a=Math.random()*Math.PI*2,r=Math.random()*200;sp[i*3]=Math.cos(a)*r;sp[i*3+1]=50+Math.random()*50;sp[i*3+2]=Math.sin(a)*r;}
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
    const starMaterial = new THREE.PointsMaterial({color:0xFFFFFF,size:1.8,sizeAttenuation:false,transparent:true,opacity:0.0,fog:false});
    scene.add(new THREE.Points(starGeo, starMaterial));

    // ── Water plane (surface waves) ──────────────────────────────────────────
    const ac = document.createElement('canvas'); ac.width=512; ac.height=512;
    const actx = ac.getContext('2d');
    const grad = actx.createRadialGradient(256,256,0,256,256,256);
    grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(0.55,'rgba(255,255,255,1)');
    grad.addColorStop(0.80,'rgba(255,255,255,0.6)'); grad.addColorStop(1,'rgba(0,0,0,0)');
    actx.fillStyle=grad; actx.fillRect(0,0,512,512);
    const alphaTexture = new THREE.CanvasTexture(ac);

    const planeGeometry = new THREE.PlaneGeometry(600,600,400,400);
    const vc = planeGeometry.attributes.position.count;
    planeGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(vc*3),3));
    const planeMaterial = new THREE.MeshStandardMaterial({vertexColors:true,transparent:true,opacity:0.92,alphaMap:alphaTexture,alphaTest:0.0,side:THREE.DoubleSide,roughness:0.55,metalness:0.05,flatShading:true,depthWrite:false});
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = -Math.PI/2; plane.position.y=0; plane.receiveShadow=true;
    scene.add(plane);
    const planePositions = planeGeometry.attributes.position;
    const planeColors = planeGeometry.attributes.color;

    // ── Water volume ─────────────────────────────────────────────────────────
    const waterVolumeGeo = new THREE.BoxGeometry(600, 10, 600);
    const waterVolumeMat = new THREE.MeshStandardMaterial({color:new THREE.Color(0x1A5A7A),transparent:true,opacity:0.45,roughness:0.3,metalness:0.1,side:THREE.BackSide,depthWrite:false});
    const waterVolume = new THREE.Mesh(waterVolumeGeo, waterVolumeMat);
    waterVolume.position.set(0,-5,0); waterVolume.renderOrder=1;
    scene.add(waterVolume);
    const waterVolumeOuterMat = new THREE.MeshStandardMaterial({color:new THREE.Color(0x1A5A7A),transparent:true,opacity:0.35,roughness:0.3,metalness:0.1,side:THREE.FrontSide,depthWrite:false});
    const waterVolumeOuter = new THREE.Mesh(waterVolumeGeo, waterVolumeOuterMat);
    waterVolumeOuter.position.set(0,-5,0); waterVolumeOuter.renderOrder=0;
    scene.add(waterVolumeOuter);

    // ── Day/Night phases ─────────────────────────────────────────────────────
    const PHASES = {
      morning:{skyTop:new THREE.Color(0xFFB89A),skyBottom:new THREE.Color(0xFFD0AA),fogColor:new THREE.Color(0xFFD0AA),fogDensity:0.003,ambientColor:new THREE.Color(0xFFDDBB),ambientIntensity:0.4,dirColor:new THREE.Color(0xFFAA66),dirIntensity:0.8,sunX:0,sunY:20,sunZ:-150,sunVisible:true,wDeep:new THREE.Color(0x6B9FAE),wMid:new THREE.Color(0x8CB5C4),wCrest:new THREE.Color(0xFFEEDD),wFoam:new THREE.Color(0xFFFFFF),moonVisible:false,starsOpacity:0.0,moonIntensity:0,label:'🌅 Утро',waterVolumeColor:new THREE.Color(0x1A5A7A)},
      day:{skyTop:new THREE.Color(0x7EC8E3),skyBottom:new THREE.Color(0xC8E8F5),fogColor:new THREE.Color(0xE8D5B7),fogDensity:0.0025,ambientColor:new THREE.Color(0xFFFFFF),ambientIntensity:0.6,dirColor:new THREE.Color(0xFFF8E7),dirIntensity:1.4,sunX:0,sunY:80,sunZ:-150,sunVisible:true,wDeep:new THREE.Color(0x3A8A9A),wMid:new THREE.Color(0x7EC8E3),wCrest:new THREE.Color(0xFFFFFF),wFoam:new THREE.Color(0xFFF8E7),moonVisible:false,starsOpacity:0.0,moonIntensity:0,label:'☀ День',waterVolumeColor:new THREE.Color(0x1A6A8A)},
      evening:{skyTop:new THREE.Color(0xFF9F8B),skyBottom:new THREE.Color(0xFFBB99),fogColor:new THREE.Color(0xFFAA77),fogDensity:0.003,ambientColor:new THREE.Color(0xFFCCAA),ambientIntensity:0.45,dirColor:new THREE.Color(0xFFB347),dirIntensity:0.9,sunX:0,sunY:10,sunZ:-150,sunVisible:true,wDeep:new THREE.Color(0x8A6A50),wMid:new THREE.Color(0xC4A882),wCrest:new THREE.Color(0xFFCCAA),wFoam:new THREE.Color(0xFFEEDD),moonVisible:false,starsOpacity:0.0,moonIntensity:0,label:'🌇 Вечер',waterVolumeColor:new THREE.Color(0x3A3A5A)},
      night:{skyTop:new THREE.Color(0x1A2A40),skyBottom:new THREE.Color(0x0F1A2A),fogColor:new THREE.Color(0x1A2A40),fogDensity:0.004,ambientColor:new THREE.Color(0x8899AA),ambientIntensity:0.15,dirColor:new THREE.Color(0x334466),dirIntensity:0.2,sunX:0,sunY:-30,sunZ:-150,sunVisible:false,wDeep:new THREE.Color(0x0F2A3A),wMid:new THREE.Color(0x1A3A4A),wCrest:new THREE.Color(0xC0C8D4),wFoam:new THREE.Color(0xD0D8E8),moonVisible:true,starsOpacity:0.9,moonIntensity:1.5,label:'🌙 Ночь',waterVolumeColor:new THREE.Color(0x0A2A3A)},
    };

    function smoothstep(x){const c=Math.max(0,Math.min(1,x));return c*c*(3-2*c);}
    function lerpNum(a,b,t){return a+(b-a)*t;}
    function lerpColor(out,a,b,t){out.set(lerpNum(a.r,b.r,t),lerpNum(a.g,b.g,t),lerpNum(a.b,b.b,t));}

    const state={fogColor:new THREE.Color(),fogDensity:0.003,ambientColor:new THREE.Color(),ambientIntensity:0.4,dirColor:new THREE.Color(),dirIntensity:1.0,sunX:0,sunY:20,sunZ:-150,sunVisible:true,wDeep:new THREE.Color(),wMid:new THREE.Color(),wCrest:new THREE.Color(),wFoam:new THREE.Color(),moonVisible:false,starsOpacity:0.0,moonIntensity:0,label:'🌅 Утро',waterVolumeColor:new THREE.Color(0x1A5A7A)};

    function transitionT(gt,b,h){return smoothstep((gt-(b-h))/(h*2));}

    function blendPhases(a,b,t){
      lerpColor(state.fogColor,a.fogColor,b.fogColor,t);
      state.fogDensity=lerpNum(a.fogDensity,b.fogDensity,t);
      lerpColor(state.ambientColor,a.ambientColor,b.ambientColor,t);
      state.ambientIntensity=lerpNum(a.ambientIntensity,b.ambientIntensity,t);
      lerpColor(state.dirColor,a.dirColor,b.dirColor,t);
      state.dirIntensity=lerpNum(a.dirIntensity,b.dirIntensity,t);
      state.sunX=lerpNum(a.sunX,b.sunX,t); state.sunY=lerpNum(a.sunY,b.sunY,t); state.sunZ=lerpNum(a.sunZ,b.sunZ,t);
      state.sunVisible=b.sunVisible||a.sunVisible;
      lerpColor(state.wDeep,a.wDeep,b.wDeep,t); lerpColor(state.wMid,a.wMid,b.wMid,t);
      lerpColor(state.wCrest,a.wCrest,b.wCrest,t); lerpColor(state.wFoam,a.wFoam,b.wFoam,t);
      lerpColor(state.waterVolumeColor,a.waterVolumeColor,b.waterVolumeColor,t);
      state.starsOpacity=lerpNum(a.starsOpacity,b.starsOpacity,t);
      state.moonIntensity=lerpNum(a.moonIntensity,b.moonIntensity,t);
      state.moonVisible=state.moonIntensity>0.01||b.moonVisible;
      state.label=t>0.5?b.label:a.label;
      const topC=new THREE.Color().copy(a.skyTop).lerp(b.skyTop,t);
      const botC=new THREE.Color().copy(a.skyBottom).lerp(b.skyBottom,t);
      document.body.style.background=`linear-gradient(to bottom,#${topC.getHexString()} 0%,#${botC.getHexString()} 100%)`;
    }

    function updateStateFromTime(gt){
      const H=10;
      if(gt<70-H){blendPhases(PHASES.morning,PHASES.morning,0);state.label=PHASES.morning.label;}
      else if(gt<70+H){blendPhases(PHASES.morning,PHASES.day,transitionT(gt,70,H));}
      else if(gt<230-H){blendPhases(PHASES.day,PHASES.day,0);state.label=PHASES.day.label;}
      else if(gt<230+H){blendPhases(PHASES.day,PHASES.evening,transitionT(gt,230,H));}
      else if(gt<300-H){blendPhases(PHASES.evening,PHASES.evening,0);state.label=PHASES.evening.label;}
      else if(gt<300+H){blendPhases(PHASES.evening,PHASES.night,transitionT(gt,300,H));}
      else if(gt<360-H){blendPhases(PHASES.night,PHASES.night,0);state.label=PHASES.night.label;}
      else{blendPhases(PHASES.night,PHASES.morning,transitionT(gt,360,H));}
    }

    function applyStateToScene(){
      scene.fog.color.copy(state.fogColor); scene.fog.density=state.fogDensity;
      ambientLight.color.copy(state.ambientColor); ambientLight.intensity=state.ambientIntensity;
      dirLight.color.copy(state.dirColor); dirLight.intensity=state.dirIntensity;
      dirLight.position.set(state.sunX,state.sunY,state.sunZ);
      sunGroup.position.set(state.sunX,state.sunY,state.sunZ);
      sunGroup.visible=state.sunVisible;
      sunLight.position.set(state.sunX,0.5,state.sunZ); sunLight.visible=state.sunVisible;
      moonGroup.visible=state.moonVisible; moonLight.intensity=state.moonIntensity;
      starMaterial.opacity=state.starsOpacity;
      waterVolumeMat.color.copy(state.waterVolumeColor);
      waterVolumeOuterMat.color.copy(state.waterVolumeColor);
    }

    // ── Shore ────────────────────────────────────────────────────────────────
    const shoreGroup = new THREE.Group();
    scene.add(shoreGroup);
    const matLS1=new THREE.MeshStandardMaterial({color:0xE8DCC8,roughness:0.92,metalness:0.0,flatShading:true});
    const matLS2=new THREE.MeshStandardMaterial({color:0xD5C8B5,roughness:0.95,metalness:0.0,flatShading:true});
    const matLS3=new THREE.MeshStandardMaterial({color:0xF0E6D8,roughness:0.90,metalness:0.0,flatShading:true});
    const matLS=[matLS1,matLS2,matLS3];
    const baseWall=new THREE.Mesh(new THREE.BoxGeometry(400,30,15),matLS1);
    baseWall.position.set(0,15,220); baseWall.castShadow=true; baseWall.receiveShadow=true;
    shoreGroup.add(baseWall);
    [{cx:-175,cz:220,w:55,h:28,d:18,mi:0},{cx:-100,cz:222,w:48,h:42,d:20,mi:1},{cx:-30,cz:219,w:52,h:20,d:16,mi:2},{cx:35,cz:223,w:44,h:50,d:22,mi:0},{cx:105,cz:220,w:50,h:35,d:18,mi:1},{cx:170,cz:221,w:46,h:45,d:20,mi:2},{cx:-62,cz:218,w:38,h:15,d:14,mi:0},{cx:72,cz:222,w:36,h:22,d:16,mi:1}]
    .forEach(b=>{const m=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d),matLS[b.mi]);m.position.set(b.cx,30+b.h/2,b.cz);m.castShadow=true;m.receiveShadow=true;shoreGroup.add(m);});
    const sandMat=new THREE.MeshStandardMaterial({color:0xF5E6C8,roughness:0.97,metalness:0.0});
    const sandStrip=new THREE.Mesh(new THREE.BoxGeometry(400,0.2,12),sandMat);
    sandStrip.position.set(0,0.1,210);sandStrip.receiveShadow=true;shoreGroup.add(sandStrip);
    [{cx:-140,cz:205,w:14,h:9,d:10},{cx:-60,cz:207,w:10,h:7,d:8},{cx:5,cz:204,w:16,h:11,d:11},{cx:80,cz:206,w:12,h:8,d:9},{cx:145,cz:205,w:13,h:10,d:9}]
    .forEach((d,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(d.w,d.h,d.d),matLS[i%3]);m.position.set(d.cx,d.h/2,d.cz);m.castShadow=true;shoreGroup.add(m);});

    // ── Clouds ───────────────────────────────────────────────────────────────
    function createCloud(){
      const g=new THREE.Group();
      const mat=new THREE.MeshStandardMaterial({color:0xFFFFFF,transparent:true,opacity:.85,roughness:1});
      [{r:1.8,x:0,y:0,z:0},{r:1.4,x:1.8,y:-.3,z:.3},{r:1.2,x:-1.6,y:-.2,z:.1},{r:1,x:.6,y:.8,z:0},{r:.9,x:-.5,y:.6,z:.2}]
      .forEach(b=>{const m=new THREE.Mesh(new THREE.SphereGeometry(b.r,10,10),mat);m.position.set(b.x,b.y,b.z);g.add(m);});
      return g;
    }
    const clouds=[];
    for(let i=0;i<12;i++){
      const cloud=createCloud();
      const px=(Math.random()-.5)*400,pz=(Math.random()-.5)*400,py=40+Math.random()*40;
      cloud.position.set(px,py,pz);
      cloud.scale.setScalar(1.5+Math.random()*2.5);
      cloud.userData.driftSpeed=.03+Math.random()*.02;
      cloud.userData.bobPhase=Math.random()*Math.PI*2;
      cloud.userData.baseY=py;
      scene.add(cloud);clouds.push(cloud);
    }

    // ── Fish materials ────────────────────────────────────────────────────────

    const fishBodyMatNormal = new THREE.MeshStandardMaterial({color:0xC8D0D8,roughness:0.4,metalness:0.35,transparent:true,opacity:0.82});

    const fishBackMatHL = new THREE.MeshBasicMaterial({color:0xFFCC00,transparent:true,opacity:0.88});
    const fishTailMatHL = new THREE.MeshBasicMaterial({color:0xFFCC00,transparent:true,opacity:0.92});

    // Aliases for opacity updates (normal mats only)
    const fishBodyMat = fishBodyMatNormal;
    const fishBackMat = fishBackMatNormal;
    const fishTailMat = fishTailMatNormal;

    const fishBodyGeo = new THREE.SphereGeometry(1,12,8);
    const fishTailGeo = new THREE.ConeGeometry(1,1,5);

    // FISH_SCALE: увеличиваем рыб в 1.5 раза
    const FISH_SCALE = 1.5;

    function createFish(){
      const fg=new THREE.Group();
      // Базовые размеры умножены на FISH_SCALE
      const bL=(0.30+Math.random()*0.10)*FISH_SCALE;
      const bH=(0.10+Math.random()*0.05)*FISH_SCALE;
      const bW=(0.075+Math.random()*0.025)*FISH_SCALE;

      const meshBody=new THREE.Mesh(fishBodyGeo,fishBodyMatNormal);
      meshBody.scale.set(bL,bH,bW); fg.add(meshBody);

      const meshBack=new THREE.Mesh(fishBodyGeo,fishBackMatNormal);
      meshBack.scale.set(bL*.95,bH*.55,bW*.9); meshBack.position.y=bH*.55; fg.add(meshBack);

      const meshTail=new THREE.Mesh(fishTailGeo,fishTailMatNormal);
      meshTail.scale.set(bH*1.1,bL*.55,bH*.6);
      meshTail.rotation.x=Math.PI/2; meshTail.rotation.z=Math.PI;
      meshTail.position.z=bL+bL*.25; fg.add(meshTail);

      fg.userData.tailMesh=meshTail;
      fg.userData.bodyLen=bL;
      fg.userData.caught=false;
      fg.userData.catchOffset=new THREE.Vector3();
      fg.userData.highlighted=false;
      fg.userData.meshBody=meshBody;
      fg.userData.meshBack=meshBack;
      fg.userData.meshTail=meshTail;
      // Таймер авто-исчезновения: -1 = не пойман
      fg.userData.disappearTimer=-1;
      return fg;
    }

    function setFishHighlight(fm, on) {
      if (fm.userData.highlighted === on) return;
      fm.userData.highlighted = on;
      fm.userData.meshBody.material = on ? fishBodyMatHL : fishBodyMatNormal;
      fm.userData.meshBack.material = on ? fishBackMatHL : fishBackMatNormal;

    // ПЛОТНЕЕ КОСЯКИ: уменьшены spreadX/Y/Z, уменьшен orbitRadius
    const SCHOOL_CONFIGS=[
      {cx:-25,cz:-30,depth:-4.5,orbitRadius:12,orbitSpeed:0.12,count:9,spreadX:1.0,spreadY:0.4,spreadZ:1.8},

      {cx:-5,cz:35,depth:-5.8,orbitRadius:14,orbitSpeed:0.09,count:8,spreadX:0.9,spreadY:0.45,spreadZ:1.6},
    ];
    const fishSchools=[];
    const fishes=[];

    SCHOOL_CONFIGS.forEach((cfg,si)=>{
      const so={cfg,orbitAngle:(si/SCHOOL_CONFIGS.length)*Math.PI*2,fish:[]};
      for(let i=0;i<cfg.count;i++){

    // ── Splash Particles ──────────────────────────────────────────────────────
    const SPLASH_PALETTE = [0xB0E0F0, 0xC8EAF5, 0xD8F0F8, 0xE8F4F8, 0xFFFFFF];

      const mat = new THREE.MeshBasicMaterial({color: SPLASH_PALETTE[i % SPLASH_PALETTE.length],transparent:true,opacity:1.0});
      const mesh = new THREE.Mesh(dropletGeo, mat);
      mesh.visible = false; mesh.renderOrder = 10;
      scene.add(mesh);
      splashPool.push({mesh,mat,active:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,maxLife:1,radius:0.15});
    }

    function spawnSplash(ox, oy, oz) {
      for (let i = 0; i < SPLASH_COUNT; i++) {
        const p = splashPool[i];
        if (p.active) continue;
        p.active = true; p.mesh.visible = true;
        p.x = ox+(Math.random()-.5)*.7; p.y = oy; p.z = oz+(Math.random()-.5)*.7;

        p.vx=Math.cos(angle)*speed*.55; p.vy=1.8+Math.random()*4.8; p.vz=Math.sin(angle)*speed*.55;
        p.maxLife=0.7+Math.random()*.8; p.life=p.maxLife;
        p.radius=0.10+Math.random()*.20; p.mesh.scale.setScalar(p.radius);
        p.mat.color.setHex(SPLASH_PALETTE[Math.floor(Math.random()*SPLASH_PALETTE.length)]);
        p.mat.opacity=1.0;
      }
    }

    function updateSplash(delta) {
      for (let i = 0; i < SPLASH_COUNT; i++) {
        const p = splashPool[i];
        if (!p.active) continue;
        p.life -= delta;
        if (p.life <= 0) { p.active=false; p.mesh.visible=false; continue; }
        p.vy -= 9.8*delta; p.x+=p.vx*delta; p.y+=p.vy*delta; p.z+=p.vz*delta;
        if (p.y<0.06){p.y=0.06; p.vy*=-0.18; p.vx*=0.65; p.vz*=0.65;}
        const tf=p.life/p.maxLife;
        p.mat.opacity=tf*tf; p.mesh.scale.setScalar(p.radius*(0.35+0.65*tf));
        p.mesh.position.set(p.x,p.y,p.z);
      }
    }

    // ── Fish counter UI ───────────────────────────────────────────────────────

    // ── Mouse look ───────────────────────────────────────────────────────────

    const npcStates=NPC_CONFIGS.map(cfg=>({

    // ── Fallback geometry seagull ─────────────────────────────────────────────
    function createFallbackGull(){
      const g=new THREE.Group();
      const white=new THREE.MeshStandardMaterial({color:0xF8F8F8,roughness:0.5,metalness:0.0});
      const gray=new THREE.MeshStandardMaterial({color:0xAAAAAA,roughness:0.6});
      const yellow=new THREE.MeshStandardMaterial({color:0xFFCC44,roughness:0.4});
      const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,8),white); body.scale.set(1.6,0.8,1.0); g.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,8),white); head.position.set(0,0.28,-0.6); g.add(head);
      const beak=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.35,6),yellow); beak.rotation.x=Math.PI/2; beak.position.set(0,0.22,-0.93); g.add(beak);
      const tail=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.55,6),white); tail.rotation.x=-Math.PI/2; tail.position.set(0,0.05,0.72); g.add(tail);
      const wingGeo=new THREE.BoxGeometry(1.8,0.06,0.55);
      const wingL=new THREE.Mesh(wingGeo,gray); wingL.position.set(-1.1,0.08,0); wingL.rotation.z=0.15; g.add(wingL);
      const wingR=new THREE.Mesh(wingGeo,gray); wingR.position.set(1.1,0.08,0); wingR.rotation.z=-0.15; g.add(wingR);
      g.userData.wingL=wingL; g.userData.wingR=wingR; g.userData.isFallback=true; g.castShadow=true;
      return g;
    }
    function animateFallbackWings(g,t){
      const wL=g.userData.wingL,wR=g.userData.wingR; if(!wL||!wR) return;
      const flap=Math.sin(t*3.5)*0.4; wL.rotation.z=0.15+flap; wR.rotation.z=-0.15-flap;
    }

    // ── GLTF helpers ─────────────────────────────────────────────────────────
    function buildGullFromGltf(gltfScene,animations,modelScale,animTimeOffset){
      const group=new THREE.Group(), inner=new THREE.Group();
      inner.rotation.y=-Math.PI/2; inner.scale.setScalar(modelScale); inner.add(gltfScene);
      gltfScene.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=false;}});
      group.add(inner);
      let mixer=null;
      if(animations&&animations.length>0){
        mixer=new THREE.AnimationMixer(gltfScene);
        const action=mixer.clipAction(animations[0]); action.setLoop(THREE.LoopRepeat,Infinity);
        if(animTimeOffset) action.time=animTimeOffset%(animations[0].duration||1);
        action.play();
      }
      return {group,mixer};
    }

    function spawnFallbackAll(){
      document.getElementById('model-status').textContent='⚠ Заглушка';
      document.getElementById('model-status').style.color='#FFD580';
      const pg=createFallbackGull(); pg.position.set(0,6,0); pg.scale.setScalar(2.5);
      scene.add(pg); playerGull=pg; playerMixer=null;
      NPC_CONFIGS.forEach(cfg=>{
        const ng=createFallbackGull(); ng.scale.setScalar(0.8+Math.random()*0.3);
        ng.position.set(cfg.cx+(Math.random()-.5)*10,3+Math.random()*9,cfg.cz+(Math.random()-.5)*10);
        scene.add(ng); npcGulls.push({group:ng,mixer:null});
      });

    // ── Model loading ─────────────────────────────────────────────────────────
    const MODEL_PATH='models/seagull/scene.gltf';
    const PLAYER_SCALE=2.5, NPC_SCALE_BASE=PLAYER_SCALE/3;
    const loadingBar=document.getElementById('loading-bar');
    const modelStatus=document.getElementById('model-status');

    spawnFallbackAll();

    const loadTimeout=setTimeout(()=>{

        modelStatus.textContent='⚠ Модель не найдена'; modelStatus.style.color='#FF9966';
        document.getElementById('loading-screen').classList.add('hidden');

    },10000);

    const playerLoader=new GLTFLoader();
    playerLoader.load(MODEL_PATH,gltf=>{
      clearTimeout(loadTimeout);
      scene.remove(playerGull);
      const {group:pGroup,mixer:pMixer}=buildGullFromGltf(gltf.scene,gltf.animations,PLAYER_SCALE,0);
      pGroup.position.set(0,6,0); scene.add(pGroup); playerGull=pGroup; playerMixer=pMixer;
      modelStatus.textContent='✓ GLTF модель'; modelStatus.style.color='#AAFFAA';
      loadingBar.style.width='30%';
      let npcLoaded=0; const NPC_TOTAL=NPC_CONFIGS.length;

          scene.add(nG); npcGulls.push({group:nG,mixer:nM});
          loadingBar.style.width=(30+(npcLoaded/NPC_TOTAL)*70).toFixed(0)+'%';

          ng2.position.set(cfg.cx,3+Math.random()*9,cfg.cz); scene.add(ng2); npcGulls.push({group:ng2,mixer:null});

    // ── Resize ───────────────────────────────────────────────────────────────
    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);

    // ── NPC animation ─────────────────────────────────────────────────────────
    function animateNPCs(delta,t){
      npcStates.forEach((npc,idx)=>{
        const cfg=npc.cfg, npcObj=npcGulls[idx]; if(!npcObj) return;
        if(npcObj.mixer) npcObj.mixer.update(delta);
        else if(npcObj.group.userData.isFallback) animateFallbackWings(npcObj.group,t);
        npc.angle+=delta*cfg.speed;
        let px,pz;
        if(cfg.figure8){px=cfg.cx+cfg.rx*Math.sin(npc.angle);pz=cfg.cz+cfg.rz*Math.sin(npc.angle*2)*0.5;}
        else{px=cfg.cx+cfg.rx*Math.cos(npc.angle);pz=cfg.cz+cfg.rz*Math.sin(npc.angle);}
        const bobY=Math.sin(t*0.35+cfg.startAngle)*cfg.bobAmp;
        npc.driftTimer-=delta;
        if(npc.driftTimer<=0){npc.targetDriftY=(Math.random()-.5)*5;npc.driftTimer=5+Math.random()*5;}
        npc.driftY+=(npc.targetDriftY-npc.driftY)*delta*0.25;
        const baseAltitude=cfg.baseY+bobY+npc.driftY;
        npc.diveTimer-=delta;
        let diveOffset=0;
        if(!npc.isDiving&&npc.diveTimer<=0){npc.isDiving=true;npc.diveProgress=0;npc.diveTimer=cfg.diveInterval+Math.random()*5;}
        if(npc.isDiving){npc.diveProgress+=delta/npc.diveDuration;if(npc.diveProgress>=1)npc.isDiving=false;diveOffset=-(cfg.baseY-1.5)*Math.sin(npc.diveProgress*Math.PI)*0.70;}
        npcObj.group.position.set(px,baseAltitude+diveOffset,pz);
        let tdx,tdz;
        if(cfg.figure8){tdx=cfg.rx*Math.cos(npc.angle);tdz=cfg.rz*Math.cos(npc.angle*2);}
        else{tdx=-cfg.rx*Math.sin(npc.angle);tdz=cfg.rz*Math.cos(npc.angle);}
        npcObj.group.rotation.y=Math.atan2(tdx,tdz);
        const tp=npc.isDiving?-Math.sin(npc.diveProgress*Math.PI)*0.45:0;
        npcObj.group.rotation.x=THREE.MathUtils.lerp(npcObj.group.rotation.x,tp,delta*3);
      });
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    let gameTime=0;
    const CYCLE=360,BASE_SPEED=1,SHORE_WALL_Z=190;
    const clock=new THREE.Clock();
    const timeIndicator=document.getElementById('time-indicator');
    const tmpColor=new THREE.Color();
    const camTargetPos=new THREE.Vector3(), camTargetLook=new THREE.Vector3();

    function waveHeight(wx,wz,t){
      const p=3;
      const w1=Math.pow(1-Math.abs(Math.sin((wx*.00875+wz*.020)+t*.45)),p)*2.2;
      const w2=Math.pow(1-Math.abs(Math.sin((wx*.01375-wz*.045)+t*.65)),p)*1.5;
      const w3=Math.pow(1-Math.abs(Math.sin((wx*.03333+wz*.080)+t*1.10)),p)*.7;
      const w4=Math.pow(1-Math.abs(Math.sin((-wx*.007+wz*.042)+t*.30)),p)*1;
      return Math.pow((w1+w2+w3+w4)/(2.2+1.5+.7+1),1.6)*9*(1+.1*Math.sin(wx*.5));
    }

    function animate(){
      requestAnimationFrame(animate);
      const delta=clock.getDelta(), t=clock.elapsedTime;

      const speed=keys['KeyN']?BASE_SPEED*10:BASE_SPEED;
      gameTime=(gameTime+delta*speed)%CYCLE;
      updateStateFromTime(gameTime);
      applyStateToScene();
      timeIndicator.textContent=`${state.label} · ${Math.floor(gameTime)}с`;

      // Water geometry
      const maxH=9,midL=maxH*.35,crL=maxH*.72,foL=maxH*.88;
      for(let i=0;i<planePositions.count;i++){
        const wx=planePositions.getX(i),wz=planePositions.getY(i);
        const h=waveHeight(wx,wz,t);
        planePositions.setZ(i,h);
        if(h>=foL) tmpColor.copy(state.wCrest).lerp(state.wFoam,Math.min((h-foL)/(maxH-foL),1));
        else if(h>=crL) tmpColor.copy(state.wMid).lerp(state.wCrest,Math.pow((h-crL)/(foL-crL),.5));
        else if(h>=midL) tmpColor.copy(state.wDeep).lerp(state.wMid,(h-midL)/(crL-midL));
        else tmpColor.copy(state.wDeep);
        planeColors.setXYZ(i,tmpColor.r,tmpColor.g,tmpColor.b);
      }
      planePositions.needsUpdate=true; planeColors.needsUpdate=true;
      planeGeometry.computeVertexNormals();

      // Clouds
      clouds.forEach(c=>{
        c.position.z-=c.userData.driftSpeed;
        if(c.position.z<-200){c.position.z=200;c.position.x=(Math.random()-.5)*400;}
        c.position.y=c.userData.baseY+Math.sin(t*.15+c.userData.bobPhase)*1.5;
      });

      // Mixers
      if(playerMixer) playerMixer.update(delta);
      else if(playerGull&&playerGull.userData.isFallback) animateFallbackWings(playerGull,t);

      animateNPCs(delta,t);

      // ── Player controls ───────────────────────────────────────────────────
      if(playerGull){
        if(keys['ArrowLeft']||keys['KeyA']) mouseYaw+=delta*1.4;
        if(keys['ArrowRight']||keys['KeyD']) mouseYaw-=delta*1.4;
        playerGull.rotation.y=mouseYaw;

        const fwdX=-Math.sin(mouseYaw), fwdZ=-Math.cos(mouseYaw);
        const fwd=new THREE.Vector3(fwdX,0,fwdZ);
        let movingForward=false;
        if(keys['ArrowUp']||keys['KeyW']){playerGull.position.addScaledVector(fwd,0.22);movingForward=true;}
        if(keys['ArrowDown']||keys['KeyS']) playerGull.position.addScaledVector(fwd,-0.12);

        const spaceDown=keys['Space'];
        const shiftDown=keys['ShiftLeft']||keys['ShiftRight'];
        const ctrlDown=keys['ControlLeft']||keys['ControlRight'];

        if(spaceDown){
          playerDive.isDiving=true; playerDive.ascending=false;
          playerGull.position.y-=DIVE_SPEED*delta;
          if(playerGull.position.y<=WATER_SURFACE){
            playerGull.position.y=WATER_SURFACE;
            if(!playerDive.splashed){
              playerDive.splashed=true;
              spawnSplash(playerGull.position.x,WATER_SURFACE+0.2,playerGull.position.z);
            }
          }
          DIVE_INDICATOR.classList.add('active');
        } else if(shiftDown&&!playerDive.isDiving){
          playerDive.ascending=false; playerDive.velocityY=0;
          playerGull.position.y=Math.min(MAX_ALTITUDE,playerGull.position.y+ASCENT_MANUAL_SPEED*delta);
          DIVE_INDICATOR.classList.remove('active');
        } else if(ctrlDown&&!playerDive.isDiving){
          playerDive.ascending=false; playerDive.velocityY=0;
          playerGull.position.y=Math.max(MIN_ALTITUDE,playerGull.position.y-DESCENT_MANUAL_SPEED*delta);
          DIVE_INDICATOR.classList.remove('active');
        } else {
          if(playerDive.isDiving){playerDive.isDiving=false;playerDive.ascending=true;playerDive.splashed=false;}
          if(playerDive.ascending){
            playerGull.position.y+=ASCENT_SPEED*delta;
            if(playerGull.position.y>=ASCENT_TARGET){playerGull.position.y=ASCENT_TARGET;playerDive.ascending=false;}
          } else {
            const curY=playerGull.position.y;
            if(curY<DEFAULT_ALTITUDE_MIN) playerDive.velocityY+=0.008;
            else if(curY>DEFAULT_ALTITUDE_MAX) playerDive.velocityY-=0.006;
            else playerDive.velocityY*=0.92;
            playerDive.velocityY+=Math.sin(t*0.4+1.3)*0.001;
            playerDive.velocityY=Math.max(-0.12,Math.min(0.12,playerDive.velocityY));
            playerGull.position.y=Math.max(MIN_ALTITUDE,Math.min(MAX_ALTITUDE,playerGull.position.y+playerDive.velocityY));
          }
          DIVE_INDICATOR.classList.remove('active');
        }

        if(playerGull.position.z>SHORE_WALL_Z)
          playerGull.position.z=SHORE_WALL_Z-(playerGull.position.z-SHORE_WALL_Z)*0.3;

        const targetPitch=playerDive.isDiving?0.55:shiftDown?-0.18:ctrlDown?0.18:(movingForward?-0.12:0);
        playerGull.rotation.x=THREE.MathUtils.lerp(playerGull.rotation.x,targetPitch,delta*5);

        if(playerMixer){
          const tws=playerDive.isDiving?0.2:shiftDown?2.5:ctrlDown?1.8:(movingForward?2.0:(playerDive.ascending?1.4:0.4));
          if(typeof playerDive._wingFreq==='undefined') playerDive._wingFreq=1.0;
          playerDive._wingFreq=THREE.MathUtils.lerp(playerDive._wingFreq,tws,delta*3);
          playerMixer.timeScale=playerDive._wingFreq;
        }

        // ── Определяем рыб в зоне ловли (5м) и минимальное расстояние ───
        let nearestFish=null, nearestDist=Infinity;
        let fishInZone=0;
        const gullY=playerGull.position.y;
        const inCatchZone=(gullY<CATCH_Y_THRESHOLD);

        fishes.forEach(fm=>{
          if(fm.userData.caught) return;
          const dx=playerGull.position.x-fm.position.x;
          const dy=gullY-fm.position.y;
          const dz=playerGull.position.z-fm.position.z;
          const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
          // Жёлтая подсветка только когда чайка в зоне ловли И рядом с косяком
          const shouldHL = inCatchZone && dist<HIGHLIGHT_RADIUS;
          setFishHighlight(fm, shouldHL);
          if(dist<HIGHLIGHT_RADIUS) fishInZone++;
          if(dist<nearestDist){nearestDist=dist;nearestFish=fm;}
        });

        // Индикатор зоны ловли
        if(inCatchZone && nearestDist<HIGHLIGHT_RADIUS){
          DIVE_INDICATOR.classList.add('catch-zone');
          DIVE_INDICATOR.textContent='🐟 ЗОНА ЛОВЛИ';
        } else if(spaceDown){
          DIVE_INDICATOR.classList.remove('catch-zone');
          DIVE_INDICATOR.textContent='▼ ПИКИРОВАНИЕ';
        } else {
          DIVE_INDICATOR.classList.remove('catch-zone');
          DIVE_INDICATOR.textContent='▼ ПИКИРОВАНИЕ';
        }

        // Консоль раз в секунду
        logTimer+=delta;
        if(logTimer>=1.0){
          logTimer=0;
          console.log(`[Рыбалка] Y чайки: ${gullY.toFixed(2)} | Рыб в радиусе ${HIGHLIGHT_RADIUS}м: ${fishInZone} | Ближайшая: ${nearestDist.toFixed(2)}м`);
        }

        // ── ЛОВЛЯ: Y < 1.5 И ближайшая рыба < 5м — автоматически ловим ──
        if(gullY < CATCH_Y_THRESHOLD && nearestFish && nearestDist < CATCH_RADIUS){
          const fm=nearestFish;
          if(!fm.userData.caught){
            fm.userData.caught=true;
            fm.userData.disappearTimer=FISH_DISAPPEAR_TIME;
            setFishHighlight(fm,false);
            console.log(`РЫБА ПОЙМАНА! Расстояние: ${nearestDist.toFixed(2)} | Y: ${gullY.toFixed(2)}`);
            onFishCaught();
            spawnSplash(fm.position.x, Math.max(fm.position.y,0.3), fm.position.z);
          }
        }

        // ── Обновляем пойманных рыб: прикрепляем к клюву, отсчитываем таймер ──
        // Позиция клюва: чуть впереди и чуть ниже центра чайки
        const beakOffsetX = fwdX * 0.5;
        const beakOffsetY = -0.3;
        const beakOffsetZ = fwdZ * 0.5;

        fishes.forEach(fm=>{
          if(!fm.userData.caught) return;
          if(fm.userData.disappearTimer > 0){
            fm.userData.disappearTimer -= delta;
            // Прикрепляем к клюву (ниже головы)
            fm.position.set(
              playerGull.position.x + beakOffsetX,
              Math.max(playerGull.position.y + beakOffsetY, WATER_SURFACE+0.05),
              playerGull.position.z + beakOffsetZ
            );
            fm.rotation.y = playerGull.rotation.y;
            // Лёгкое трепетание пойманной рыбы
            fm.rotation.z = Math.sin(t*8)*0.15;

            // Исчезает через 5 секунд
            if(fm.userData.disappearTimer <= 0){
              scene.remove(fm);
              fm.userData.disappearTimer = -1;
            }
          }
        });

        // Camera
        camTargetPos.set(playerGull.position.x-fwdX*5,playerGull.position.y+2+mousePitch*4,playerGull.position.z-fwdZ*5);
        camTargetLook.set(playerGull.position.x+fwdX*8,playerGull.position.y-mousePitch*3,playerGull.position.z+fwdZ*8);
        camera.position.lerp(camTargetPos,0.10);
        camera.lookAt(camTargetLook);
      }

      // Catch popup timer
      if(popupTimer>0){popupTimer-=delta;if(popupTimer<=0)catchPopupEl.style.opacity='0';}

      // Splash
      updateSplash(delta);

      // Fish opacity by time of day
      let fo;
      if(state.label.includes('День')) fo=0.82;
      else if(state.label.includes('Ночь')) fo=0.30;
      else fo=0.58;
      fishBodyMat.opacity=fo; fishBackMat.opacity=fo*0.88; fishTailMat.opacity=fo*0.92;

      // Fish school animation
      fishSchools.forEach(school=>{
        const cfg=school.cfg;
        school.orbitAngle+=delta*cfg.orbitSpeed;
        const oa=school.orbitAngle;
        const sCX=cfg.cx+Math.cos(oa)*cfg.orbitRadius;
        const sCZ=cfg.cz+Math.sin(oa)*cfg.orbitRadius;
        const sY=cfg.depth+Math.sin(t*0.15+oa)*0.5;
        const sDX=-Math.sin(oa),sDZ=Math.cos(oa);

        school.fish.forEach(fm=>{
          if(fm.userData.caught) return;
          const ud=fm.userData;
          ud.nextDirChange-=delta;
          if(ud.nextDirChange<=0){ud.targetDirOffset=(Math.random()-.5)*0.28;ud.dirLerpProgress=0;ud.nextDirChange=ud.dirChangeInterval;}
          if(ud.dirLerpProgress<1){ud.dirLerpProgress=Math.min(1,ud.dirLerpProgress+delta*0.4);ud.currentDirOffset+=(ud.targetDirOffset-ud.currentDirOffset)*ud.dirLerpProgress*delta*0.5;}
          const fa=oa+ud.currentDirOffset;
          const fdX=-Math.sin(fa),fdZ=Math.cos(fa);
          const so=Math.sin(t*ud.sideFreq+ud.sidePhase)*ud.sideAmplitude;
          const pX=-fdZ,pZ=fdX;
          const lP=ud.longitudinalOffset+Math.sin(t*ud.sideFreq*0.3+ud.sidePhase)*0.4;
          fm.position.set(sCX+ud.baseOffX+pX*so+sDX*lP,sY+ud.baseOffY+Math.sin(t*0.6+ud.sidePhase)*0.18,sCZ+ud.baseOffZ+pZ*so+sDZ*lP);
          fm.rotation.set(0,-fa,0);
          const bw=Math.sin(t*ud.bodyWobbleFreq+ud.bodyWobblePhase)*ud.bodyWobbleAmp;
          fm.rotation.z=bw;
          if(ud.tailMesh) ud.tailMesh.rotation.y=Math.sin(t*ud.tailFreq+ud.tailPhase)*ud.tailAmp;
          const fv=Math.sin(t*(1.0/ud.flashInterval)*Math.PI+ud.flashPhase);
          fm.rotation.z+=Math.pow(Math.max(0,fv),3)*0.52;
        });
      });

      renderer.render(scene,camera);
    }

    animate();
  </script>
</body>
